---
- name: Provisionamento simplificado do Projeto Korp
  hosts: localhost
  become: yes
  vars:
    project_dir: /tmp/desafio_devops

  tasks:
    # ---------- 1. Instalação do Docker ----------
    - name: Instalar dependencias base
      apt:
        name: [ca-certificates, curl, gnupg]
        update_cache: yes

    - name: Criar diretorio para keyring do Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar chave GPG do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar repositorio do Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Instalar Docker e Docker Compose
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: yes

    - name: Garantir que o Docker esta ativo
      service:
        name: docker
        state: started
        enabled: yes

    # ---------- 2. Copiar Projeto ----------
    - name: Criar diretorio do projeto
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Copiar arquivos do projeto
      copy:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        mode: '0755'

    # ---------- 3. Subir Ambiente ----------
    - name: Fazer build e subir os containers com Docker Compose
      command: docker compose -f docker/docker-compose.yml up -d --build
      args:
        chdir: "{{ project_dir }}"

    - name: Aguardar servicos inicializarem
      pause:
        seconds: 15

    # ---------- 4. Validacao ----------
    - name: Validar endpoint /projeto-korp via HTTP
      uri:
        url: http://localhost/projeto-korp
        method: GET
        return_content: yes
        status_code: 200
      register: result
      until: result.status == 200
      retries: 6
      delay: 5

    - name: Exibir resposta do servico no console
      debug:
        var: result.content