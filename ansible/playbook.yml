---
- name: Provisionamento completo do Projeto Korp
  hosts: all
  become: yes
  vars:
    project_dir: /tmp/desafio_devops
    docker_network: korp-network

  tasks:
    # ---------- Pré-requisitos ----------
    - name: Instalar pacotes base
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - rsync
        update_cache: yes

    - name: Criar diretório para keyring do Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixar chave GPG do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Adicionar repositório do Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Instalar Docker e plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes

    - name: Garantir que o serviço Docker está ativo
      service:
        name: docker
        state: started
        enabled: yes

    # ---------- Copiar projeto ----------
    - name: Criar diretório do projeto
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Sincronizar arquivos do projeto
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=ansible"
          - "--exclude=src/vendor"
      become: yes

    # ---------- Rede Docker ----------
    - name: Verificar se a rede Docker já existe
      command: docker network inspect {{ docker_network }}
      register: network_status
      ignore_errors: yes
      changed_when: false

    - name: Criar rede Docker bridge
      command: docker network create {{ docker_network }}
      when: network_status.failed

    # ---------- Build da imagem ----------
    - name: Build da imagem http-server-projeto-korp
      command: docker build -t http-server-projeto-korp:latest -f docker/Dockerfile ./src
      args:
        chdir: "{{ project_dir }}"
      changed_when: false

    # ---------- Subir ambiente ----------
    - name: Subir stack com docker compose
      command: docker compose -f docker/docker-compose.yml up -d
      args:
        chdir: "{{ project_dir }}"

    - name: Aguardar serviços inicializarem
      pause:
        seconds: 15

    # ---------- Validação ----------
    - name: Validar endpoint /projeto-korp
      uri:
        url: http://localhost/projeto-korp
        method: GET
        return_content: yes
        status_code: 200
      register: result
      until: result.status == 200
      retries: 6
      delay: 5

    - name: Exibir resposta do serviço no console
      debug:
        var: result.content